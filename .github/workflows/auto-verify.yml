name: Auto Verify

on:
  pull_request:
    branches: [develop, master]

jobs:
  template-contract:
    name: Portable Harness contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test template synchronization, provenance and PR merge gates
        run: python -B -m unittest discover -s tests/codex/project_template -p 'test_*.py'
      - name: Upstream adapters regenerate the committed files (line endings normalised) (#668)
        run: |
          python -B adapters/html-plan/generate.py --check
          python -B adapters/superpowers/generate.py --check
          python -B -m unittest discover -s tests/codex -p 'test_upstream_adapters.py'
      - name: Harness projection is in sync and the builder behaves (#674)
        run: |
          python -B scripts/harness/build.py --target . --check
          python -B -m unittest discover -s tests/codex -p 'test_harness_build.py'

  toolcall-xml-lint:
    name: Tool-call XML Lint (#527)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Claude-context files for literal tool-call markers
        run: bash scripts/toolcall-xml-lint.sh

      - name: Self-test the linter
        run: bash scripts/test-toolcall-xml-lint.sh

  lane-receiver-rule:
    name: Cross-lane receiver rule (#615)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Both harnesses load the same receiver rule
        run: bash scripts/check-lane-receiver-rule.sh

      - name: Self-test the check
        run: bash scripts/test-check-lane-receiver-rule.sh

name: Auto Verify

on:
  pull_request:
    branches: [develop, master]

jobs:
  template-contract:
    name: Portable Harness contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test template synchronization, provenance and PR merge gates
        run: python -B -m unittest discover -s tests/codex/project_template -p 'test_*.py'
      - name: Upstream adapters regenerate the committed files (line endings normalised) (#668)
        run: |
          python -B packs/plan/build/generate.py --check
          python -B packs/subagent-dev/build/generate.py --check
          python -B -m unittest discover -s tests/tools -p 'test_upstream_adapters.py'
      - name: Installed packs are in sync and the installer behaves (#674, #680)
        run: |
          python -B tools/mercury.py check --target .
          python -B -m unittest discover -s tests/tools -p 'test_mercury.py'

  toolcall-xml-lint:
    name: Tool-call XML Lint (#527)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Claude-context files for literal tool-call markers
        run: bash scripts/toolcall-xml-lint.sh

      - name: Self-test the linter
        run: bash scripts/test-toolcall-xml-lint.sh

  lane-receiver-rule:
    name: Cross-lane receiver rule (#615)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Both harnesses load the same receiver rule
        run: bash .mercury/packs/lanes/scripts/check-lane-receiver-rule.sh

      - name: Self-test the check
        run: bash tests/lanes/test-check-lane-receiver-rule.sh

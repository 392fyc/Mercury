name: Agents Event Check

on:
  pull_request:
    paths:
      - 'scripts/agents_gateway/**'
      - 'scripts/agents_event_client.py'
      - 'scripts/test_agents_event_client.py'
      - 'scripts/agents_event_dispatcher.py'
      - 'scripts/test_agents_event_dispatcher.py'
      - 'scripts/install_agents_event_dispatcher.ps1'
      - 'scripts/agents_dispatcher/**'
      - '.github/workflows/agents-event-check.yml'
  push:
    branches: [develop]
    paths:
      - 'scripts/agents_gateway/**'
      - 'scripts/agents_event_client.py'
      - 'scripts/test_agents_event_client.py'
      - 'scripts/agents_event_dispatcher.py'
      - 'scripts/test_agents_event_dispatcher.py'
      - 'scripts/install_agents_event_dispatcher.ps1'
      - 'scripts/agents_dispatcher/**'
      - '.github/workflows/agents-event-check.yml'

permissions:
  contents: read

jobs:
  event-boundaries:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest scripts.agents_gateway.test_server -v
      - run: python -B -m unittest discover -s scripts -p test_agents_event_client.py -v
      - run: python -B -m unittest discover -s scripts -p test_agents_event_dispatcher.py -v
      - name: Parse Windows installer
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/install_agents_event_dispatcher.ps1'),
            [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }

name: Dot Link Check

on:
  pull_request:
    paths:
      - 'packs/dot-link/**'
      - '.mercury/packs/dot-link/**'
      - 'tests/dot/**'
      - '.github/workflows/dot-link-check.yml'
  push:
    branches: [develop]
    paths:
      - 'packs/dot-link/**'
      - '.mercury/packs/dot-link/**'
      - 'tests/dot/**'
      - '.github/workflows/dot-link-check.yml'

jobs:
  signed-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tests/dot/test-dot-link.py
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./tests/dot/test-dot-link-install.ps1

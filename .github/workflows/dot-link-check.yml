name: Dot Link Check

on:
  pull_request:
    paths:
      - 'packs/dot-link/**'
      - '.mercury/packs/dot-link/**'
      - 'tests/dot/**'
      - '.github/workflows/dot-link-check.yml'
  push:
    branches: [master]
    paths:
      - 'packs/dot-link/**'
      - '.mercury/packs/dot-link/**'
      - 'tests/dot/**'
      - '.github/workflows/dot-link-check.yml'

jobs:
  signed-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python tests/dot/test-dot-link.py
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: ./tests/dot/test-dot-link-install.ps1
  signed-messages-windows:
    # #686: the same signed-message tests as signed-messages, on Windows (passes locally under Windows, 8 tests)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python tests/dot/test-dot-link.py

# Mercury — Codex CLI project config
# Docs: https://developers.openai.com/codex/config-reference

# Ensure web search is always available and live
web_search = "live"

# 权限姿态（G2-3，Issue #571）。
#
# Claude Code 侧对应的是 .claude/settings.local.json 的 defaultMode = bypassPermissions
# 加 18 条 allow —— 实质是全放行，靠 hook 兜底。**这里刻意不做 1:1 直译**：
# 把「全放行」搬到 Codex 等于用 --yolo，而 Codex 有更合适的表达方式，
# 且实测已确认 .codex/rules/ 的运行时自动发现是有效的（它拦住了 git commit，
# 原样回显了 rules 里的 justification）。
#
# 于是姿态改成三层各司其职，而不是「全放行 + 事后拦」：
#   - sandbox_mode = workspace-write：能改本仓文件，改不了仓外的东西。
#     写 C:\Program Files 这类操作实测会被沙箱直接拒（patch rejected:
#     writing outside of the project），不必等 hook。
#   - approval_policy = on-request：不逐步打断，需要越权时才问。
#   - 危险的具体命令（受保护分支推送、绕过 guard 的 commit 等）交给 .codex/rules/。
#
# 没有配 writable_roots：跨仓库作业时用 --add-dir 显式声明，比常驻放开更清楚。
# network_access 必须开 —— git push / pnpm install / gh 都要它，
# 关掉会让整条开发流程在沙箱里失败，而这些操作本身已由 rules 层管着。
# ⚠️ 只放顶层标量。section（[xxx]）一律写在文件末尾 —— 见下方 [features] 那段注释：
# TOML 的 section 会捕获其后**所有** key=value 直到下一个 section 头，
# 在这里插一个 section 会把 developer_instructions 静默 re-parent 进去，
# 而 **TOML 解析依然合法、不会报任何错**。改完必须验证顶层键，光验证「解析通过」查不出来。
sandbox_mode = "workspace-write"
approval_policy = "on-request"

# Mandatory instructions injected into every session
developer_instructions = """
MANDATORY: Before writing ANY code that imports an external SDK/API package or references API signatures:
1. Use web_search to verify against the vendor's OFFICIAL documentation first
2. Cross-check npm/PyPI for package version and publish status
3. GitHub source code alone is NOT sufficient (repos may show dev versions)
4. Include source URLs when reporting technical findings
5. If web_search fails, mark claims as UNVERIFIED
6. Never commit or push directly on develop, master, or main
7. If the current branch is protected or does not match feature/TASK-<id> or lane/<lane>/(init|<n>|<n>-<slug>), stop and move the work to a task branch before committing
8. **Codex hooks do NOT fire — do not rely on them.** `.codex/hooks.json` registers 10 commands and the `hooks` feature flag reads `stable`/`true`, but measured on CLI 0.147.0 (2026-08-14, Issue #571 / G2-1) a real session performing a real `apply_patch` did NOT invoke the hook. Method: an unconditional log line was instrumented at the top of scope-guard.sh; the probe file WAS created (so the patch really happened) and the manual-invocation control DID write the log (so the instrumentation and path were correct), yet the session produced no log line. Root cause is UNVERIFIED — the official docs pages for Codex hooks 404 and could not be checked. **The real enforcement layer on Codex is `.codex/rules/`**, which was confirmed in the same session: `git push origin HEAD` was `declined in 0ms` at the router with the rules justification echoed verbatim. Treat `scripts/codex/*.ps1` wrappers and clause #6/#7 self-discipline as the remaining lines, and do not assume any hook will stop you
9. Defense-in-depth: scripts/codex/*.ps1 wrappers (powershell -File scripts/codex/git-safe.ps1 add/commit/push) remain available as fallback when hooks cannot be relied on (e.g. shell invocation in non-Codex contexts)
10. Before every commit on a PR branch, run dual-verify: spawn TWO independent subagents that review the change blind and in parallel, at different `model_reasoning_effort` levels, then compare their findings. Reviewing your own work inside a single agent context does NOT satisfy this gate. (The legacy wording "parallel Claude Code deep-review + Codex code-audit" assumed Claude Code hosted the session; it no longer applies once Codex is the harness — see AGENTS.md and Issue #571.) This gate applies to every milestone commit, not only PR-branch commits, and auto-verify alone does NOT satisfy it. Then run `powershell -File scripts/codex/guard.ps1 mark-review`
11. Web-research enforcement: Codex hooks do NOT cover web_search tool calls (no handler — see Issue #20204), and `.codex/rules/` does NOT constrain it either — rules match command prefixes, which cannot reach a hosted tool. So clauses #1-5 above are the ONLY enforcement, and they are advisory: nothing will block you. This rule runs on self-discipline on Codex. Verify your own compliance before each external SDK/API claim.
12. 用户可见的回复一律用正常、清楚的简体中文完整句子。禁止网络黑话与内部简写 —— 英文缩写和中文圈内话都算，碰到就用平实的话讲清楚。专有名词、命令、接口名、字段名保留原文往往更清楚，保留即可；判断标准是读者能不能看懂，不是句子里有没有英文。宁可多写一句把事情说明白，也不要压缩到看不懂。严禁韩文与日文。代码、commit message、PR body 保持各自既有惯例（英文为主）。
"""

# Enable lifecycle hooks (Codex CLI >= v0.124 GA, stable since v0.128).
# Hook config lives in .codex/hooks.json (preferred over inline [hooks]).
# Canonical flag name is `hooks` since Codex PR #20522 (alias of legacy
# `codex_hooks`); empirically verified via `codex features list` against
# Codex CLI 0.129.0 — flag stage `stable`, default `true`. Explicit setting
# documents intent + protects against silent regression if the default flips.
# Section MUST come AFTER all top-level scalars: TOML section scoping captures
# every subsequent key=value pair until the next section header — placing
# [features] earlier would silently re-parent later scalars (e.g.
# developer_instructions) under features.* and break Codex config validation.
# See .mercury/docs/research/codex-hooks-adoption-2026-05.md for ADR.
[features]
hooks = true

# workspace-write 档位下的细则。network_access 必须开 —— git push / pnpm install / gh
# 都要它，关掉会让整条开发流程在沙箱里失败，而这些操作本身已由 .codex/rules/ 管着。
# 没有配 writable_roots：跨仓库作业时用 --add-dir 显式声明，比常驻放开更清楚。
[sandbox_workspace_write]
network_access = true

# MCP servers（项目级；用户级 ~/.codex/config.toml 另配了 obsidian 与 godot）。
# 从 .mcp.json 迁来 —— Codex 没有独立的 .mcp.json，MCP 声明并入 config.toml。
# 原先标为「未验证」的两点已于 2026-08-14 查明：
#
# ① `$MERCURY_PLAYWRIGHT_STORAGE_STATE` 由谁展开 —— **问错了方向**。展开不是 Codex 做的，
#    是适配器自己做的：`adapters/playwright-mcp/launch.cjs` 的 `expandEnv()` 同时处理
#    `%VAR%` / `${VAR}` / `$VAR` 三种写法，并在有 token 未解析时**抛错 fail-closed**。
#    所以 Codex 展不展开都不影响结果。
#
# ② **但该变量在进程 / 用户 / 机器三个层级全都没有设置**，因此适配器必然拒绝启动：
#      config gate rejected launch: unresolved environment variable in path:
#      "$MERCURY_PLAYWRIGHT_STORAGE_STATE" → "$MERCURY_PLAYWRIGHT_STORAGE_STATE"
#    这**不是迁移造成的回归** —— Claude Code 的 .mcp.json 里是逐字相同的参数，
#    playwright MCP 在两个 harness 上都早已起不来，只是迁移把它照出来了。
#    要让它可用，需要把该变量指向一个真实的 storage-state 文件（内含浏览器登录态，
#    属用户私有路径，这也正是它用环境变量而非硬编码的原因）。这是用户侧决定，未擅自设置。
#
# ③ 相对路径 `./adapters/...` 的解析基准：上面那次运行以仓库根为 cwd 成功定位到脚本，
#    说明基准是启动 MCP 时的工作目录；跨仓库启动时需注意。
# 未迁的两条：.mcp.json 里的 `codex`（codex mcp-server —— 在 Codex 里配它自己没意义）
# 与 `mercury-orchestrator`（实现已随 #173/#174 归档到 archive/packages/orchestrator，
# 端口 7654 上没有任何东西在监听；配置残留另行清理）。
[mcp_servers.playwright]
command = "node"
args = [
  "./adapters/playwright-mcp/launch.cjs",
  "--isolated",
  "--caps=storage",
  "--storage-state=$MERCURY_PLAYWRIGHT_STORAGE_STATE",
]
startup_timeout_sec = 30

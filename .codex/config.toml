# Mercury — Codex CLI project config
# Docs: https://developers.openai.com/codex/config-reference

# Ensure web search is always available and live
web_search = "live"

# Mandatory instructions injected into every session
developer_instructions = """
MANDATORY: Before writing ANY code that imports an external SDK/API package or references API signatures:
1. Use web_search to verify against the vendor's OFFICIAL documentation first
2. Cross-check npm/PyPI for package version and publish status
3. GitHub source code alone is NOT sufficient (repos may show dev versions)
4. Include source URLs when reporting technical findings
5. If web_search fails, mark claims as UNVERIFIED
6. Never commit or push directly on develop, master, or main
7. If the current branch is protected or does not match feature/TASK-<id> or lane/<lane>/(init|<n>|<n>-<slug>), stop and move the work to a task branch before committing
8. Codex hooks (.codex/hooks.json) are the primary enforcement layer for Bash + apply_patch tool calls (push-guard / pre-commit-guard / pr-create-guard / pr-merge-guard / scope-guard)
9. Defense-in-depth: scripts/codex/*.ps1 wrappers (powershell -File scripts/codex/git-safe.ps1 add/commit/push) remain available as fallback when hooks cannot be relied on (e.g. shell invocation in non-Codex contexts)
10. Before every commit on a PR branch, run dual-verify: spawn TWO independent subagents that review the change blind and in parallel, at different `model_reasoning_effort` levels, then compare their findings. Reviewing your own work inside a single agent context does NOT satisfy this gate. (The legacy wording "parallel Claude Code deep-review + Codex code-audit" assumed Claude Code hosted the session; it no longer applies once Codex is the harness — see AGENTS.md and Issue #571.) This gate applies to every milestone commit, not only PR-branch commits, and auto-verify alone does NOT satisfy it. Then run `powershell -File scripts/codex/guard.ps1 mark-review`
11. Web-research enforcement: Codex hooks do NOT cover web_search tool calls (no handler — see Issue #20204). The web-research MUST is enforced at instruction level via clauses #1-5 above and via .codex/rules/. Verify your own compliance before each external SDK/API claim.
12. 用户可见的回复一律用正常、清楚的简体中文完整句子。禁止网络黑话与内部简写 —— 英文缩写和中文圈内话都算，碰到就用平实的话讲清楚。专有名词、命令、接口名、字段名保留原文往往更清楚，保留即可；判断标准是读者能不能看懂，不是句子里有没有英文。宁可多写一句把事情说明白，也不要压缩到看不懂。严禁韩文与日文。代码、commit message、PR body 保持各自既有惯例（英文为主）。
"""

# Enable lifecycle hooks (Codex CLI >= v0.124 GA, stable since v0.128).
# Hook config lives in .codex/hooks.json (preferred over inline [hooks]).
# Canonical flag name is `hooks` since Codex PR #20522 (alias of legacy
# `codex_hooks`); empirically verified via `codex features list` against
# Codex CLI 0.129.0 — flag stage `stable`, default `true`. Explicit setting
# documents intent + protects against silent regression if the default flips.
# Section MUST come AFTER all top-level scalars: TOML section scoping captures
# every subsequent key=value pair until the next section header — placing
# [features] earlier would silently re-parent later scalars (e.g.
# developer_instructions) under features.* and break Codex config validation.
# See .mercury/docs/research/codex-hooks-adoption-2026-05.md for ADR.
[features]
hooks = true

# MCP servers（项目级；用户级 ~/.codex/config.toml 另配了 obsidian 与 godot）。
# 从 .mcp.json 迁来 —— Codex 没有独立的 .mcp.json，MCP 声明并入 config.toml。
# 两处**未验证**：① $MERCURY_PLAYWRIGHT_STORAGE_STATE 这个占位符 Codex 会不会展开；
# ② 相对路径 ./adapters/... 的解析基准是不是仓库根。首次真实调用时确认。
# 未迁的两条：.mcp.json 里的 `codex`（codex mcp-server —— 在 Codex 里配它自己没意义）
# 与 `mercury-orchestrator`（实现已随 #173/#174 归档到 archive/packages/orchestrator，
# 端口 7654 上没有任何东西在监听；配置残留另行清理）。
[mcp_servers.playwright]
command = "node"
args = [
  "./adapters/playwright-mcp/launch.cjs",
  "--isolated",
  "--caps=storage",
  "--storage-state=$MERCURY_PLAYWRIGHT_STORAGE_STATE",
]
startup_timeout_sec = 30
